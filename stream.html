<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e meter</title>
  <link rel="stylesheet" type="text/css" href="stream.css">
</head>

<body>

  <main>

    <section>

      <div id="dial">
        <div id="meter">
          <div id="needle"></div>
        </div>
        <div id="leds" hidden></div>
      </div>
      <div class="ends"><span id="pct-l">—</span><span id="pct-r">—</span></div>

      <div class="controls">
        <div class="ta">
          Tone Arm (scroll): <span class="val" id="ta-v">—</span>
          <div class="ta-row">
            <button class="btn" id="ta-dn" title="lower (hold to repeat)">−</button>
            <input id="ta" type="range" min="-3" max="4.6" step="0.001" value="0">
            <button class="btn" id="ta-up" title="raise (hold to repeat)">+</button>
          </div>
        </div>
        <label>
          Sensitivity (zoom): <span class="val" id="sens-v">—</span>
          <br>
          <input id="sens" type="range" min="0.01" max="5" step="0.01" value="2">
        </label>
      </div>

    </section>

    <section>

      <div id="src">
        <input id="pi" placeholder="raspberrypi.local:8000" spellcheck="false">
        <button id="go" class="btn">connect</button>
      </div>

      <div id="st">connecting</div>
      <div id="note"></div>

      <div id="readout">reading: <span id="us">—</span></div>

      <div id="menus">
        <label>Display
          <select id="disp">
            <option value="needle">Needle</option>
            <option value="glow">LED glow</option>
            <option value="fill">LED fill</option>
          </select>
        </label>
        <label>Units
          <select id="units">
            <option value="u">µS</option>
            <option value="n">nS</option>
            <option value="r">Ω (resistance)</option>
          </select>
        </label>
        <button id="rec" class="btn">● REC</button>
      </div>

      <canvas id="poly" width="320" height="80"></canvas>

    </section>

  </main>

  <div id="toast">
    <span id="toast-label"></span>
    <span id="toast-meta"></span>
    <button id="toast-dismiss" title="dismiss">×</button>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const needle = $("needle");
    const MINUS = "\u2212";
    const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

    // ── persisted menu choices ──
    function load(k, d, ok) {
      try { const v = localStorage[k]; return ok.includes(v) ? v : d; } catch (e) { return d; }
    }
    function save(k, v) { try { localStorage[k] = v; } catch (e) { } }

    let units = load("units", "u", ["u", "n", "r"]);          // µS | nS | resistance
    let disp = load("disp", "needle", ["needle", "glow", "fill"]);
    $("units").value = units;
    $("disp").value = disp;

    // ── controls ──
    // A manual tone arm, like the real thing. `ref` is the conductance (uS) at which
    // the needle reads centered, and nothing but you ever moves it:
    //     needle position = (smoothed reading - ref) * sensitivity,   full scale = ±1
    // so the dial spans ref ± 1/sensitivity uS. Conductance up (resistance falls)
    // swings the needle right/clockwise. When it pegs, turn the tone arm to re-center.
    let sensitivity = 2;
    $("sens").oninput = e => { sensitivity = parseFloat(e.target.value); placeNeedle(); render(); };

    // ── needle state ──
    // A dt-aware EMA driven by the stream's own timestamps (d.t, seconds), so the
    // smoothing is in real seconds no matter how the network batches frames.
    const SMOOTH_TAU_S = 0.15;   // needle responsiveness

    let smooth = null;
    let lastFrameT = null;       // ms, stream time of last sample with contact
    let lastG = null;            // raw reading, uS
    let streamT = 0;             // s, stream time of the latest frame of any kind
    let live = false;            // false while the server replays its backlog on connect

    function updateNeedle(g, tMs) {
      const dt = lastFrameT === null ? 0.05 : Math.max((tMs - lastFrameT) / 1000, 0.001);
      lastFrameT = tMs;

      if (smooth === null) smooth = g;
      smooth += (g - smooth) * Math.min(dt / SMOOTH_TAU_S, 1);

      if (ref === null && live) setRef(g);     // the very first reading ever: the one automatic act
      placeNeedle();
    }

    function placeNeedle() {
      if (smooth === null || ref === null) return;
      // convention: resistance falls (conductance rises) = needle goes right/clockwise
      const pos = (smooth - ref) * sensitivity;
      const final = clamp(pos, -1, 1);
      needle.style.transform = `rotate(${-90 + (final + 1) * 90}deg)`;
      ledHit(pos);
    }

    // ── tone arm (manual; the only thing that ever moves `ref`) ──
    // Controls: slider (coarse, log scale), +/- buttons (fine, hold to repeat),
    // mouse wheel over the dial (1% a notch, Shift = 5%). "Up" always means up in the
    // displayed unit, so in the Ω view the slider and wheel run the other way.
    const REF_MIN = 1e-3, REF_MAX = 1e4;                      // uS
    const SL_MIN = Math.log(0.05), SL_MAX = Math.log(100);    // slider span, uS (log)
    let ref = (() => {                                        // survives reloads and reconnects
      try { const v = parseFloat(localStorage.ref); return v > 0 ? v : null; } catch (e) { return null; }
    })();
    const dir = () => units === "r" ? -1 : 1;

    function syncSlider() {
      const s = $("ta"), d = dir();
      s.min = d > 0 ? SL_MIN : -SL_MAX;
      s.max = d > 0 ? SL_MAX : -SL_MIN;
      if (ref !== null) s.value = d * Math.log(ref);
    }
    function setRef(x, fromSlider) {
      ref = clamp(x, REF_MIN, REF_MAX);
      save("ref", ref);
      if (!fromSlider) syncSlider();
      placeNeedle();
      render();
    }
    function stepRef(pct) {                                   // + raises, - lowers (displayed unit)
      if (ref === null) return;
      const f = 1 + pct / 100;
      setRef(dir() > 0 ? ref * f : ref / f);
    }
    $("ta").oninput = e => setRef(Math.exp(dir() * parseFloat(e.target.value)), true);

    $("dial").addEventListener("wheel", e => {
      e.preventDefault();
      const dy = e.deltaY * (e.deltaMode === 1 ? 33 : 1);     // lines -> pixels (Firefox)
      stepRef(-Math.sign(dy) * (e.shiftKey ? 5 : 1) * Math.min(Math.abs(dy) / 100, 1));
    }, { passive: false });

    function holdRepeat(btn, sign) {
      let delay = null, timer = null, n = 0;
      const stop = () => { clearTimeout(delay); clearInterval(timer); };
      btn.onpointerdown = e => {
        e.preventDefault();
        stop();
        n = 0;
        stepRef(sign * 0.25);
        delay = setTimeout(() => {
          timer = setInterval(() => stepRef(sign * (++n > 25 ? 1 : 0.25)), 40);   // speeds up after ~1 s
        }, 350);
      };
      btn.onpointerup = btn.onpointerleave = btn.onpointercancel = stop;
    }
    holdRepeat($("ta-up"), +1);
    holdRepeat($("ta-dn"), -1);
    syncSlider();

    // ── LED bar (same idea as the curses meter) ──
    const NSEG = 41, C = (NSEG - 1) / 2;
    const leds = [];
    const ledBr = new Array(NSEG).fill(0);   // glow brightness 0..1, decays
    let ledHead = null, ledPegged = false;
    const LED_TRAIL_S = 0.5;                 // how long the glow takes to fade
    for (let i = 0; i < NSEG; i++) {
      const d = document.createElement("div");
      d.className = "led";
      $("leds").appendChild(d);
      leds.push({ el: d, css: "" });
    }

    function ledHit(pos) {
      const raw = C + Math.round(pos * C);
      const h = clamp(raw, 0, NSEG - 1);
      ledPegged = raw < 0 || raw > NSEG - 1;
      if (ledHead !== null) {                // light the sweep path
        const lo = Math.min(h, ledHead), hi = Math.max(h, ledHead);
        for (let i = lo; i <= hi; i++) ledBr[i] = Math.max(ledBr[i], 0.9);
      }
      ledBr[h] = 1;
      ledHead = h;
    }

    // green / amber / red by distance from center
    function gradient(f) {
      const stops = [[0, [0, 220, 90]], [0.5, [255, 200, 0]], [1, [255, 50, 40]]];
      f = clamp(f, 0, 1);
      for (let i = 0; i < 2; i++) {
        const [f0, c0] = stops[i], [f1, c1] = stops[i + 1];
        if (f <= f1) {
          const t = (f - f0) / (f1 - f0);
          return c0.map((a, j) => a + (c1[j] - a) * t);
        }
      }
      return stops[2][1];
    }

    function ledColor(i, level) {
      if (i === ledHead) return ledPegged ? "rgb(255,60,50)" : "rgb(255,255,255)";
      if (level === 0) return "#222";
      const k = [0.28, 0.55, 1][level - 1];
      const [r, g, b] = gradient(Math.abs(i - C) / C).map(c => Math.round(c * k));
      return `rgb(${r},${g},${b})`;
    }

    function paintLeds() {
      if (disp === "needle") return;
      const level = new Array(NSEG).fill(0);
      if (disp === "glow") {
        ledBr.forEach((b, i) => { level[i] = b > 0.75 ? 3 : b > 0.45 ? 2 : b > 0.15 ? 1 : 0; });
      } else if (ledHead !== null) {         // fill: solid from center to head
        const lo = Math.min(C, ledHead), hi = Math.max(C, ledHead);
        for (let i = lo; i <= hi; i++) level[i] = 3;
      }
      leds.forEach((l, i) => {
        const css = ledColor(i, level[i]);
        if (css !== l.css) { l.css = css; l.el.style.background = css; }
      });
    }

    function applyDisp() {
      const led = disp !== "needle";
      $("meter").hidden = led;
      $("leds").hidden = !led;
    }
    $("disp").onchange = e => { disp = e.target.value; save("disp", disp); applyDisp(); };
    applyDisp();

    // ── units (display only: needle, tone arm and plot all work in uS) ──
    // "r" shows resistance = 1/conductance. 1 nS = 1 GΩ, 1 µS = 1 MΩ. Resistance
    // falls as conductance rises, so it is not symmetric: dial ends are shown
    // as two separate changes (right end / left end) rather than a single ±.
    $("units").onchange = e => { units = e.target.value; save("units", units); syncSlider(); render(); };

    function fmtG(x) {                       // uS number, curses-style precision
      const a = Math.abs(x);
      return a < 10 ? x.toFixed(3) : a < 100 ? x.toFixed(2) : a < 1000 ? x.toFixed(1) : x.toFixed(0);
    }
    function fmtR(ohm) {                     // auto-prefixed ohms
      if (!isFinite(ohm)) return "∞ Ω";
      const a = Math.abs(ohm);
      const [d, p] = a >= 1e9 ? [1e9, "G"] : a >= 1e6 ? [1e6, "M"] : a >= 1e3 ? [1e3, "k"] : [1, ""];
      const v = ohm / d, av = Math.abs(v);
      return (av < 10 ? v.toFixed(2) : av < 100 ? v.toFixed(1) : v.toFixed(0)) + " " + p + "Ω";
    }
    const fmtC = uS => units === "n" ? Math.round(uS * 1000) + " nS" : fmtG(uS) + " µS";
    const signed = (x, s) => (x < 0 ? MINUS : "+") + s;       // s = formatted magnitude

    function showVal(uS) {                   // an absolute reading in the chosen unit
      if (uS == null) return "—";
      if (units === "r") return uS > 0 ? fmtR(1e6 / uS) : "∞ Ω";
      return fmtC(uS);
    }

    // change in resistance if conductance moves from the tone arm to tone arm + d
    function dR(d) {
      const g = ref + d;
      if (g <= 0) return Infinity;
      return 1e6 / g - 1e6 / ref;
    }
    const showDR = x => x === Infinity ? "+∞" : signed(x, fmtR(Math.abs(x)));

    function pctStr(p) {
      if (p === null) return "—";
      if (!isFinite(p)) return (p > 0 ? "+" : MINUS) + "∞%";
      const a = Math.abs(p);
      return (p < 0 ? MINUS : "+") + (a < 10 ? a.toFixed(1) : Math.round(a)) + "%";
    }
    // % change from the tone arm that parks the needle at position pos (-1 left, +1 right).
    // Fixed by the tone arm and sensitivity: these only change when you turn a knob.
    function endPct(pos) {
      if (ref == null || ref <= 0) return null;
      const dev = pos / sensitivity;                           // uS from the tone arm
      if (units === "r") {
        const g = ref + dev;
        return g <= 0 ? Infinity : (ref / g - 1) * 100;        // resistance % change
      }
      return dev / ref * 100;                                  // conductance % change
    }

    function render() {
      $("us").textContent = showVal(lastG);
      $("ta-v").textContent = showVal(ref);                    // the tone arm, in the chosen unit

      const half = 1 / sensitivity;                            // uS from center to dial end
      if (units === "r") {
        const ok = ref != null && ref > 0;
        $("sens-v").textContent = ok ? `${showDR(dR(half))} / ${showDR(dR(-half))}` : "—";
      } else {
        $("sens-v").textContent = "±" + fmtC(half);
      }
      $("pct-l").textContent = pctStr(endPct(-1));
      $("pct-r").textContent = pctStr(endPct(1));
    }

    // ── polygram (canvas) ──
    const ctx = $("poly").getContext("2d");
    const W = 320, H = 80;
    const WINDOW_MS = 30000;
    const GAP_MS = 1000;         // break the line across gaps (no-contact frames)

    let polyData = [];           // { t (stream ms), g }
    let marks = [];              // { t (stream ms, event start), rebound } dotted lines

    function updatePolygram(g, tMs) {
      polyData.push({ t: tMs, g });
      const cutoff = tMs - WINDOW_MS;
      let n = 0;
      while (n < polyData.length && polyData[n].t < cutoff) n++;
      if (n > 0) polyData.splice(0, n);
      if (marks.length) marks = marks.filter(m => m.t >= cutoff);
    }

    function renderPolygram() {
      ctx.clearRect(0, 0, W, H);
      if (polyData.length < 2) return;

      let min = Infinity, max = -Infinity;
      for (const p of polyData) {
        if (p.g < min) min = p.g;
        if (p.g > max) max = p.g;
      }
      const pad = Math.max((max - min) * 0.2, 2);
      const lo = min - pad;
      const range = (max + pad - lo) || 1;

      const now = polyData[polyData.length - 1].t;
      const toY = v => H * (1 - (v - lo) / range);
      const toX = t => W * (1 - (now - t) / WINDOW_MS);

      // event marks: dotted vertical line where each detected excursion began
      if (marks.length) {
        ctx.save();
        ctx.setLineDash([2, 3]);
        ctx.lineWidth = 1;
        for (const m of marks) {
          const x = Math.round(toX(m.t)) + 0.5;
          if (x < 0 || x > W) continue;
          ctx.strokeStyle = m.rebound ? "#555" : "#aaa";
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        ctx.restore();
      }

      ctx.beginPath();
      ctx.strokeStyle = "red";
      ctx.lineWidth = 1.5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      for (let i = 0; i < polyData.length; i++) {
        const x = toX(polyData[i].t), y = toY(polyData[i].g);
        const gap = i > 0 && polyData[i].t - polyData[i - 1].t > GAP_MS;
        (i === 0 || gap) ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // one animation loop: fade the LED glow, repaint LEDs and polygram
    let lastPaint = performance.now();
    function frame(nowMs) {
      requestAnimationFrame(frame);
      const k = Math.exp(-((nowMs - lastPaint) / 1000) / LED_TRAIL_S);
      lastPaint = nowMs;
      for (let i = 0; i < NSEG; i++) ledBr[i] *= k;
      paintLeds();
      renderPolygram();
    }
    requestAnimationFrame(frame);

    // ── recording (the Pi does the recording; this just asks it to) ──
    let base = "";               // http://host:port of the stream server
    let recOn = false, recSince = null;
    let noteTimer = null;

    function showNote(text, cls) {
      $("note").textContent = text;
      $("note").className = cls || "";
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => { $("note").textContent = ""; }, 10000);
    }

    function recLabel() {
      if (!recOn) { $("rec").textContent = "● REC"; return; }
      const s = Math.max(0, Math.floor(streamT - (recSince || 0)));
      $("rec").textContent = `● REC ${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    }

    function applyRec(s) {
      recOn = !!s.on;
      recSince = s.since == null ? null : s.since;
      $("rec").classList.toggle("rec-on", recOn);
      recLabel();
      if (!recOn && "cues" in s) {
        showNote(s.saved ? `saved ${s.saved} on the Pi (${s.cues} cues)` : "recording empty, nothing saved");
      }
    }

    async function toggleRec() {
      if (!base) return;
      try {
        const r = await fetch(base + (recOn ? "/record/stop" : "/record/start"), { method: "POST" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        applyRec(await r.json());
      } catch (e) {
        showNote("record failed: " + e.message, "bad");
      }
    }
    $("rec").onclick = toggleRec;

    // ── events: toast + polygram mark ──
    // Detector events arrive as "ev" SSE events when a READ closes. On connect the
    // server replays recent ones; those get a mark but no toast (they're old news).
    const TOAST_MS = 5000;
    let toastTimer = null;
    const toR = p => p <= -100 ? Infinity : (1 / (1 + p / 100) - 1) * 100;   // % in G -> % in R
    const rateStr = r => !isFinite(r) ? "∞" : Math.abs(r) < 10 ? Math.abs(r).toFixed(1) : String(Math.round(Math.abs(r)));

    function showToast(ev) {
      const inR = units === "r";                         // follow the Units menu
      const amp = inR ? toR(ev.amp_pct) : ev.amp_pct;
      const rate = inR ? toR(ev.direction * ev.rate_pct_s) : ev.direction * ev.rate_pct_s;
      $("toast-label").textContent = `${amp > 0 ? "▲" : "▼"} ${pctStr(amp)}`;
      $("toast-meta").textContent =
        `${ev.duration.toFixed(1)} s · ${rateStr(rate)} %/s` + (ev.rebound ? " · rebound" : "");
      $("toast").classList.toggle("rebound", ev.rebound);
      $("toast").classList.toggle("visible", true);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, TOAST_MS);
    }
    function hideToast() { $("toast").classList.toggle("visible", false); }
    $("toast-dismiss").onclick = () => { clearTimeout(toastTimer); hideToast(); };

    function onEvent(ev) {
      marks.push({ t: ev.t_start * 1000, rebound: ev.rebound });
      if (streamT - ev.t_end < 2) showToast(ev);         // live, not a replay
    }

    // ── stream ──
    // stream.py: GET /stream -> SSE frames {"t": secs, "v": volts, "g": uS | null},
    // "rec" events {"on": bool, ...} when recording starts or stops, and "ev" events
    // (one per finished detector Event). The "state" event is not used by the page yet.
    let es = null;
    let lastRx = 0;

    function setStatus(text, cls) {
      $("st").textContent = text;
      $("st").className = cls || "";
    }

    function resetState() {
      smooth = null;
      live = false;
      lastFrameT = null;
      lastG = null;
      polyData = [];
      marks = [];
      ledBr.fill(0);
      ledHead = null;
      ledPegged = false;
      needle.style.transform = "";
      render();
    }

    function connect() {
      let a = $("pi").value.trim();
      if (!a) return;
      save("pi", a);
      if (!/^https?:\/\//.test(a)) a = "http://" + a;
      base = a.replace(/\/+$/, "");
      if (es) es.close();
      resetState();
      lastRx = 0;
      setStatus("connecting", "warn");

      es = new EventSource(base + "/stream");

      // the server replays the last 60 s on every (re)connect, so start clean
      es.onopen = () => { resetState(); setStatus("connected", "live"); };

      es.onmessage = e => {
        const d = JSON.parse(e.data);
        lastRx = performance.now();
        streamT = d.t;
        lastG = d.g;
        if (d.g == null) {
          setStatus("no contact / out of range", "warn");
        } else {
          setStatus("live", "live");
          updateNeedle(d.g, d.t * 1000);
          updatePolygram(d.g, d.t * 1000);
        }
        render();
        if (recOn) recLabel();
      };

      // the server sends "rec" right after the backlog, so the first one means we're live
      es.addEventListener("rec", e => {
        live = true;
        if (ref === null && lastG != null) setRef(lastG);
        applyRec(JSON.parse(e.data));
      });
      es.addEventListener("ev", e => onEvent(JSON.parse(e.data)));

      es.onerror = () => setStatus("stream lost, retrying", "bad");
    }

    // address: ?pi=host:port, else last used, else default
    let saved = "";
    try { saved = localStorage.pi || ""; } catch (e) { }
    $("pi").value = new URLSearchParams(location.search).get("pi") || saved || "raspberrypi.local:8000";
    $("go").onclick = connect;
    $("pi").onkeydown = e => { if (e.key === "Enter") connect(); };

    // a frozen needle must never look like a flat signal
    setInterval(() => {
      if (lastRx && performance.now() - lastRx > 2000) setStatus("no data", "bad");
    }, 500);

    render();
    connect();
  </script>

</body>

</html>
