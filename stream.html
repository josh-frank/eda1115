<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e meter</title>
  <link rel="stylesheet" type="text/css" href="stream.css">
</head>

<body>

  <main>

    <section>

      <div id="meter">
        <div id="needle"></div>
      </div>

      <div class="controls">
        <label>
          Tone Arm
          <br>
          <input id="ta" type="range" min="-5" max="5" step="0.01" value="0">
        </label>
        <label>
          Sensitivity (zoom)
          <br>
          <input id="sens" type="range" min="0.01" max="5" step="0.01" value="2">
        </label>
      </div>

    </section>

    <section>

      <div id="src">
        <input id="pi" placeholder="raspberrypi.local:8000" spellcheck="false">
        <button id="go" class="btn">connect</button>
      </div>

      <div id="st">connecting</div>

      <div id="readout"><span id="unit">µS</span>: <span id="us">—</span> &nbsp; baseline: <span
          id="baseline-readout">—</span></div>

      <label><input type="checkbox" id="nano"> nS (nano) instead of µS</label>

      <canvas id="poly" width="320" height="80"></canvas>

    </section>

  </main>

  <script>
    const $ = id => document.getElementById(id);
    const needle = $("needle");

    // ── controls ──
    let toneArm = 0;
    let sensitivity = 2;
    $("ta").oninput = e => { toneArm = parseFloat(e.target.value); };
    $("sens").oninput = e => { sensitivity = parseFloat(e.target.value); };

    // ── needle state ──
    // dt-aware EMAs driven by the stream's own timestamps (d.t, seconds), so
    // drift rate is in real seconds no matter how the network batches frames,
    // and a backfill replay rebuilds exactly the state a live run would have.
    const SMOOTH_TAU_S = 0.15;   // fast tracker: needle responsiveness
    const BASELINE_TAU_S = 20;   // slow tonic tracker: "where is home"

    let baseline = null;
    let smooth = null;
    let lastFrameT = null;       // ms, stream time
    let lastG = null;            // raw reading, uS

    function updateNeedle(g, tMs) {
      const dt = lastFrameT === null ? 0.05 : Math.max((tMs - lastFrameT) / 1000, 0.001);
      lastFrameT = tMs;

      if (smooth === null) smooth = g;
      if (baseline === null) baseline = g;

      smooth += (g - smooth) * Math.min(dt / SMOOTH_TAU_S, 1);
      baseline += (g - baseline) * Math.min(dt / BASELINE_TAU_S, 1);

      const drive = (smooth - baseline) * sensitivity;
      // convention: resistance falls (conductance rises) = needle goes right/clockwise
      const final = Math.max(-1, Math.min(1, drive + toneArm));
      needle.style.transform = `rotate(${-90 + (final + 1) * 90}deg)`;
    }

    // ── units (display only: needle, baseline and plot all work in uS) ──
    try { $("nano").checked = localStorage.nano === "1"; } catch (e) { }
    $("nano").onchange = () => {
      try { localStorage.nano = $("nano").checked ? "1" : "0"; } catch (e) { }
      render();
    };

    function render() {
      const n = $("nano").checked, k = n ? 1000 : 1;
      const f = (x, d) => x == null ? "—" : (x * k).toFixed(n ? 0 : d);
      $("unit").textContent = n ? "nS" : "µS";
      $("us").textContent = f(lastG, 2);
      $("baseline-readout").textContent = f(baseline, 3);
    }

    // ── polygram (canvas) ──
    const ctx = $("poly").getContext("2d");
    const W = 320, H = 80;
    const WINDOW_MS = 30000;
    const GAP_MS = 1000;         // break the line across gaps (no-contact frames)

    let polyData = [];           // { t (stream ms), g }

    function updatePolygram(g, tMs) {
      polyData.push({ t: tMs, g });
      const cutoff = tMs - WINDOW_MS;
      let n = 0;
      while (n < polyData.length && polyData[n].t < cutoff) n++;
      if (n > 0) polyData.splice(0, n);
    }

    function renderPolygram() {
      requestAnimationFrame(renderPolygram);
      ctx.clearRect(0, 0, W, H);
      if (polyData.length < 2) return;

      let min = Infinity, max = -Infinity;
      for (const p of polyData) {
        if (p.g < min) min = p.g;
        if (p.g > max) max = p.g;
      }
      const pad = Math.max((max - min) * 0.2, 2);
      const lo = min - pad;
      const range = (max + pad - lo) || 1;

      const now = polyData[polyData.length - 1].t;
      const toY = v => H * (1 - (v - lo) / range);
      const toX = t => W * (1 - (now - t) / WINDOW_MS);

      ctx.beginPath();
      ctx.strokeStyle = "red";
      ctx.lineWidth = 1.5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      for (let i = 0; i < polyData.length; i++) {
        const x = toX(polyData[i].t), y = toY(polyData[i].g);
        const gap = i > 0 && polyData[i].t - polyData[i - 1].t > GAP_MS;
        (i === 0 || gap) ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    renderPolygram();

    // ── stream ──
    // stream.py: GET /stream -> SSE frames {"t": secs, "v": volts, "g": uS | null}
    let es = null;
    let lastRx = 0;

    function setStatus(text, cls) {
      $("st").textContent = text;
      $("st").className = cls || "";
    }

    function resetState() {
      baseline = null;
      smooth = null;
      lastFrameT = null;
      lastG = null;
      polyData = [];
      render();
    }

    function connect() {
      let a = $("pi").value.trim();
      if (!a) return;
      try { localStorage.pi = a; } catch (e) { }
      if (!/^https?:\/\//.test(a)) a = "http://" + a;
      if (es) es.close();
      resetState();
      lastRx = 0;
      setStatus("connecting", "warn");

      es = new EventSource(a.replace(/\/+$/, "") + "/stream");

      // the server replays the last 60 s on every (re)connect, so start clean
      es.onopen = () => { resetState(); setStatus("connected", "live"); };

      es.onmessage = e => {
        const d = JSON.parse(e.data);
        lastRx = performance.now();
        lastG = d.g;
        if (d.g == null) {
          setStatus("no contact / out of range", "warn");
        } else {
          setStatus("live", "live");
          updateNeedle(d.g, d.t * 1000);
          updatePolygram(d.g, d.t * 1000);
        }
        render();
      };

      es.onerror = () => setStatus("stream lost, retrying", "bad");
    }

    // address: ?pi=host:port, else last used, else default
    let saved = "";
    try { saved = localStorage.pi || ""; } catch (e) { }
    $("pi").value = new URLSearchParams(location.search).get("pi") || saved || "raspberrypi.local:8000";
    $("go").onclick = connect;
    $("pi").onkeydown = e => { if (e.key === "Enter") connect(); };

    // a frozen needle must never look like a flat signal
    setInterval(() => {
      if (lastRx && performance.now() - lastRx > 2000) setStatus("no data", "bad");
    }, 500);

    render();
    connect();
  </script>

</body>

</html>
